[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multitask-misinformation-detection"
version = "1.0.0"
description = "A reproducible multi-task learning pipeline for low-resource Swahili misinformation and hate speech detection."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

authors = [
    { name = "Timothy" }
]

keywords = [
    "nlp",
    "misinformation",
    "hate-speech",
    "multitask-learning",
    "transformers",
    "xlm-roberta",
    "swahili",
    "deep-learning"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]

dependencies = [
    "torch>=2.2,<3.0",
    "transformers>=4.40,<5.0",
    "datasets>=2.18,<3.0",
    "tokenizers>=0.15,<1.0",
    "accelerate>=0.29,<1.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.4,<2.0",
    "tqdm>=4.66,<5.0",
    "matplotlib>=3.8,<4.0",
    "jupyter>=1.0",
    "notebook>=7.0",
    "ipywidgets>=8.1,<9.0"
]

[project.optional-dependencies]

dev = [
    "black>=24.0",
    "isort>=5.13",
    "pytest>=8.0",
    "ruff>=0.4"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]